[project]
name = "conduit-mocking-framework"
version = "0.1.0"
description = "AQA-фреймворк: моки на всех уровнях для Conduit (RealWorld)"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    # Тест-раннер и плагины
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    # E2E и перехват сети
    "playwright>=1.48",
    "pytest-playwright>=0.6",
    # API-клиент и модели
    "httpx>=0.27",
    "pydantic>=2.9",
    # Моки
    "respx>=0.21",
    "freezegun>=1.5",
    # Отчёты
    "allure-pytest>=2.13",
]
