[pytest]
testpaths = tests
pythonpath = .
addopts = -ra

# strict: pytest-asyncio трогает только тесты с @pytest.mark.asyncio.
# В auto он оборачивал бы в event loop всё подряд, а Playwright sync API
# падает внутри работающего loop ("Sync API inside the asyncio loop").
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    mock_only: тест имеет смысл только в --mode=mock (скипается в real)
    real_only: тест имеет смысл только в --mode=real (скипается в mock)
